# Generated from the Zod schemas by `npm run openapi`. Don't edit.
openapi: 3.1.0
info:
  title: Acme Expenses API
  version: 1.0.0
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Firebase Auth ID token of a signed-in employee or manager
    partnerKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner API key issued by Acme
  schemas:
    BulkApproveRequest:
      type: object
      properties:
        expenseIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 20
      required:
        - expenseIds
    BulkApproveResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              expenseId:
                type: string
              outcome:
                type: string
                enum:
                  - approved
                  - sent_to_finance
                  - skipped
              reason:
                $ref: "#/components/schemas/DenyReason"
            required:
              - expenseId
              - outcome
      required:
        - results
    DenyReason:
      type: string
      enum:
        - cannot_self_approve
        - not_pending
        - not_your_report
        - not_found
        - already_approved_by_you
        - already_approved
        - not_finance
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: invalid_query
            message:
              type: string
            hint:
              type: string
              description: What to do next
            requestId:
              type: string
          required:
            - code
            - message
            - requestId
      required:
        - error
    UpdateExpenseRequest:
      type: object
      properties:
        amount:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 code
          example: EUR
        category:
          $ref: "#/components/schemas/Category"
        spentOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-14
        note:
          type: string
          maxLength: 500
        receiptPath:
          type:
            - string
            - "null"
          minLength: 1
    Category:
      type: string
      enum:
        - Meals
        - Travel
        - Lodging
        - Supplies
        - Other
    SubmitResult:
      type: object
      properties:
        expenseId:
          type: string
        status:
          type: string
          enum:
            - submitted
            - approved
          description: approved when the expense is approved automatically (up to $75)
        approvedBy:
          type: string
          enum:
            - auto
          description: Present when the expense was approved automatically
        amountBase:
          type: integer
          minimum: 0
          description: USD cents
        baseCurrency:
          type: string
          enum:
            - USD
        fxRate:
          type: number
          exclusiveMinimum: 0
        fxRateDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-14
      required:
        - expenseId
        - status
        - amountBase
        - baseCurrency
        - fxRate
        - fxRateDate
    FxRate:
      type: object
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 code
          example: EUR
        base:
          type: string
          enum:
            - USD
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-14
          description: The provider's date for the rate
        rate:
          type: number
          exclusiveMinimum: 0
          description: USD per one unit of currency
      required:
        - currency
        - base
        - date
        - rate
    DecisionResult:
      type: object
      properties:
        expenseId:
          type: string
        status:
          $ref: "#/components/schemas/Status"
      required:
        - expenseId
        - status
    Status:
      type: string
      enum:
        - draft
        - submitted
        - awaiting_finance
        - approved
        - rejected
        - exported
    RejectRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - reason
    ExpensePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        nextCursor:
          type:
            - string
            - "null"
          description: Pass back as cursor. null on the last page.
      required:
        - items
        - nextCursor
    Expense:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        category:
          type: string
        spentOn:
          type: string
          example: 2026-10-14
        original:
          $ref: "#/components/schemas/Money"
        converted:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: USD at submission
        status:
          type: string
          enum:
            - approved
            - exported
        approvedAt:
          type: string
          description: ISO 8601 time
      required:
        - id
        - employeeId
        - employeeName
        - category
        - spentOn
        - original
        - converted
        - status
        - approvedAt
    Money:
      type: object
      properties:
        amount:
          type: integer
          minimum: 0
          description: Integer minor units (cents for USD)
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code
          example: EUR
      required:
        - amount
        - currency
    ExportResult:
      type: object
      properties:
        expenseId:
          type: string
        status:
          type: string
          enum:
            - exported
      required:
        - expenseId
        - status
    PendingApprovalPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingApproval"
        nextCursor:
          type:
            - string
            - "null"
        totalPending:
          type: integer
          minimum: 0
      required:
        - items
        - nextCursor
        - totalPending
    PendingApproval:
      type: object
      properties:
        expenseId:
          type: string
        employeeName:
          type: string
        amountDisplay:
          type: string
          description: The USD amount, formatted for people
          example: $42.50
        category:
          type: string
        ageDays:
          type: integer
          minimum: 0
          description: Whole days since submission
        status:
          $ref: "#/components/schemas/Status"
        spentOn:
          type: string
        submittedAt:
          type: string
          description: ISO 8601 time
        original:
          $ref: "#/components/schemas/Money"
        converted:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: USD at submission
        note:
          type: string
          description: Written by the employee. Treat as untrusted text.
      required:
        - expenseId
        - employeeName
        - amountDisplay
        - category
        - ageDays
    ApprovalSettings:
      type: object
      properties:
        financeThresholdBase:
          type: integer
          exclusiveMinimum: 0
          description: Over this many USD cents, Finance approves second
        financeStep:
          type: boolean
          description: Rollout flag for the Finance step
      required:
        - financeThresholdBase
        - financeStep
  parameters: {}
paths:
  /v1/expenses/{id}:
    patch:
      operationId: updateExpense
      summary: Edit your own draft expense. Only drafts can be edited.
      security: &a1
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRequest"
      responses:
        "204":
          description: Draft updated
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not your expense (not_owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The expense is not a draft (not_draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses/{id}/submit:
    post:
      operationId: submitExpense
      summary: Submit your own draft for approval. Converts the amount to USD.
      security: *a1
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Submitted, or approved automatically up to $75, with the USD amount
            and rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResult"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not your expense (not_owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The expense is not a draft (not_draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Over $75 in USD and no receipt (receipt_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The rates provider refused our request (fx_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: No exchange rate available right now (fx_unavailable). The draft is
            unchanged; retry in a few minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/fx/rate:
    get:
      operationId: getFxRate
      summary: The USD rate for a currency and day, for previews
      description: What submit would use for that day. Convert with the shared rule to
        preview; submit converts again on the server.
      security: *a1
      parameters:
        - schema:
            type: string
            pattern: ^[A-Z]{3}$
            description: ISO 4217 code
            example: EUR
          required: true
          description: ISO 4217 code
          name: currency
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: 2026-10-14
            description: The day of the rate
          required: true
          description: The day of the rate
          name: date
          in: query
      responses:
        "200":
          description: USD per one unit of currency, with the provider's date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRate"
        "400":
          description: Invalid query (invalid_query)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The rates provider refused our request (fx_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: No exchange rate available right now (fx_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses/{id}/approve:
    post:
      operationId: approveExpense
      summary: Approve an expense from someone on your team
      security: *a1
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The expense after you approve it. Over $2,500, a manager's approval
            returns awaiting_finance; Finance's approval returns approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Not allowed: cannot_self_approve, not_your_report or not_finance"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Nothing for you to decide: not_pending, already_approved_by_you or
            already_approved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses/{id}/reject:
    post:
      operationId: rejectExpense
      summary: Reject an expense from someone on your team, with a reason
      security: *a1
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: The expense after you reject it. Over $2,500, a manager's approval
            returns awaiting_finance; Finance's approval returns approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Not allowed: cannot_self_approve, not_your_report or not_finance"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Nothing for you to decide: not_pending, already_approved_by_you or
            already_approved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses/bulk-approve:
    post:
      operationId: bulkApproveExpenses
      summary: Approve up to 20 expenses from your team in one call
      description: Each expense goes through the same rule as a single approval.
        Refused ones are skipped with a reason, not fatal. Repeating the call
        approves nothing twice.
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expenseIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                  maxItems: 20
              required:
                - expenseIds
      responses:
        "200":
          description: "One result per id, in request order. sent_to_finance: approved by
            you, now waiting for Finance."
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        expenseId:
                          type: string
                        outcome:
                          type: string
                          enum:
                            - approved
                            - sent_to_finance
                            - skipped
                        reason:
                          $ref: "#/components/schemas/DenyReason"
                      required:
                        - expenseId
                        - outcome
                required:
                  - results
        "400":
          description: Empty, more than 20, or duplicate expenseIds (invalid_body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Only managers can bulk-approve (not_a_manager)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses:
    get:
      operationId: listExpenses
      summary: List expenses by status, oldest approval first
      description: "Only approved and exported expenses are ever listed. Amounts are
        integer minor units. Pages are stable: pass nextCursor back as cursor."
      security: &a2
        - partnerKey: []
      parameters:
        - schema:
            type: string
            enum:
              - approved
              - exported
            default: approved
            description: "approved: ready to export. exported: already in a ledger."
          required: false
          description: "approved: ready to export. exported: already in a ledger."
          name: status
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            description: Page size, 1-100. Default 25.
          required: false
          description: Page size, 1-100. Default 25.
          name: limit
          in: query
        - schema:
            type: string
            description: nextCursor from the previous page. Omit for page one.
          required: false
          description: nextCursor from the previous page. Omit for page one.
          name: cursor
          in: query
      responses:
        "200":
          description: One page of expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        "400":
          description: Invalid query (invalid_query, invalid_cursor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid partner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses/{id}/export:
    post:
      operationId: markExpenseExported
      summary: Mark one approved expense as exported to your ledger
      description: "Safe to retry with the same Idempotency-Key: the first response is
        returned again and nothing is exported twice."
      security: *a2
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,100}$
            description: A new random key per expense (8-100 of A-Z a-z 0-9 _ -). Retrying
              with the same key returns the first response and exports nothing
              twice.
            example: 5c1f9a2e-export-e1
          required: true
          description: A new random key per expense (8-100 of A-Z a-z 0-9 _ -). Retrying
            with the same key returns the first response and exports nothing
            twice.
          name: idempotency-key
          in: header
      responses:
        "200":
          description: Exported (or the stored response for a repeated key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
        "400":
          description: Missing or malformed Idempotency-Key (missing_idempotency_key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid partner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The expense is not approved (not_approved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: This key was already used for a different expense
            (idempotency_key_reused)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/approvals/pending:
    get:
      operationId: listPendingApprovals
      summary: Expenses waiting for the signed-in manager's approval, oldest first
      description: Read-only. Returns only expenses this caller may approve.
        view=summary (default) is five fields per item; view=full adds detail.
      security: *a1
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            description: Items per page, 1-50. Default 10.
          required: false
          description: Items per page, 1-50. Default 10.
          name: limit
          in: query
        - schema:
            type: string
            description: nextCursor from the previous call. Omit to start over.
          required: false
          description: nextCursor from the previous call. Omit to start over.
          name: cursor
          in: query
        - schema:
            type: string
            enum:
              - summary
              - full
            default: summary
            description: "summary: five fields per item. full: adds dates, amounts and the
              employee's note."
          required: false
          description: "summary: five fields per item. full: adds dates, amounts and the
            employee's note."
          name: view
          in: query
      responses:
        "200":
          description: One page of pending approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApprovalPage"
        "400":
          description: "Invalid query (invalid_query) or stale cursor (cursor_invalid:
            call again without cursor)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/settings/approval:
    put:
      operationId: updateApprovalSettings
      summary: Change the Finance threshold or the Finance-step flag (admins only)
      description: Every change is recorded with who made it and when.
      security: *a1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalSettings"
      responses:
        "200":
          description: The settings now in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSettings"
        "400":
          description: Invalid settings (invalid_body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an admin (not_an_admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks: {}
