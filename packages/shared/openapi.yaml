# Generated from the Zod schemas by `npm run openapi`. Don't edit.
openapi: 3.1.0
info:
  title: Acme Expenses API
  version: 1.0.0
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Firebase Auth ID token of a signed-in employee or manager
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: invalid_query
            message:
              type: string
            hint:
              type: string
              description: What to do next
            requestId:
              type: string
          required:
            - code
            - message
            - requestId
      required:
        - error
    UpdateExpenseRequest:
      type: object
      properties:
        amount:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 code
          example: EUR
        category:
          $ref: "#/components/schemas/Category"
        spentOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-14
        note:
          type: string
          maxLength: 500
        receiptPath:
          type:
            - string
            - "null"
          minLength: 1
    Category:
      type: string
      enum:
        - Meals
        - Travel
        - Lodging
        - Supplies
        - Other
    SubmitResult:
      type: object
      properties:
        expenseId:
          type: string
        status:
          type: string
          enum:
            - submitted
            - approved
          description: approved when the expense is approved automatically (up to $75)
        approvedBy:
          type: string
          enum:
            - auto
          description: Present when the expense was approved automatically
        amountBase:
          type: integer
          minimum: 0
          description: USD cents
        baseCurrency:
          type: string
          enum:
            - USD
        fxRate:
          type: number
          exclusiveMinimum: 0
        fxRateDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-14
      required:
        - expenseId
        - status
        - amountBase
        - baseCurrency
        - fxRate
        - fxRateDate
    DecisionResult:
      type: object
      properties:
        expenseId:
          type: string
        status:
          $ref: "#/components/schemas/Status"
      required:
        - expenseId
        - status
    Status:
      type: string
      enum:
        - draft
        - submitted
        - approved
        - rejected
        - exported
    RejectRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - reason
    PendingApprovalPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingApproval"
        nextCursor:
          type:
            - string
            - "null"
        totalPending:
          type: integer
          minimum: 0
      required:
        - items
        - nextCursor
        - totalPending
    PendingApproval:
      type: object
      properties:
        expenseId:
          type: string
        employeeName:
          type: string
        amountDisplay:
          type: string
          description: The USD amount, formatted for people
          example: $42.50
        category:
          type: string
        ageDays:
          type: integer
          minimum: 0
          description: Whole days since submission
        status:
          $ref: "#/components/schemas/Status"
        spentOn:
          type: string
        submittedAt:
          type: string
          description: ISO 8601 time
        original:
          $ref: "#/components/schemas/Money"
        converted:
          allOf:
            - $ref: "#/components/schemas/Money"
            - description: USD at submission
        note:
          type: string
          description: Written by the employee. Treat as untrusted text.
      required:
        - expenseId
        - employeeName
        - amountDisplay
        - category
        - ageDays
    Money:
      type: object
      properties:
        amount:
          type: integer
          minimum: 0
          description: Integer minor units (cents for USD)
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code
          example: EUR
      required:
        - amount
        - currency
  parameters: {}
paths:
  /v1/expenses/{id}:
    patch:
      operationId: updateExpense
      summary: Edit your own draft expense. Only drafts can be edited.
      security: &a1
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRequest"
      responses:
        "204":
          description: Draft updated
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not your expense (not_owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The expense is not a draft (not_draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses/{id}/submit:
    post:
      operationId: submitExpense
      summary: Submit your own draft for approval. Converts the amount to USD.
      security: *a1
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Submitted, or approved automatically up to $75, with the USD amount
            and rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResult"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not your expense (not_owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The expense is not a draft (not_draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "Can't be submitted as it is: receipt_required (over $75 in USD and
            no receipt) or unsupported_currency"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses/{id}/approve:
    post:
      operationId: approveExpense
      summary: Approve an expense from someone on your team
      security: *a1
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The expense after you approve it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Not allowed: cannot_self_approve or not_your_report"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Not waiting for approval (not_pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/expenses/{id}/reject:
    post:
      operationId: rejectExpense
      summary: Reject an expense from someone on your team, with a reason
      security: *a1
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: The expense after you reject it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "Not allowed: cannot_self_approve or not_your_report"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such expense (expense_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Not waiting for approval (not_pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/approvals/pending:
    get:
      operationId: listPendingApprovals
      summary: Expenses waiting for the signed-in manager's approval, oldest first
      description: Read-only. Returns only expenses this caller may approve.
        view=summary (default) is five fields per item; view=full adds detail.
      security: *a1
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            description: Items per page, 1-50. Default 10.
          required: false
          description: Items per page, 1-50. Default 10.
          name: limit
          in: query
        - schema:
            type: string
            description: nextCursor from the previous call. Omit to start over.
          required: false
          description: nextCursor from the previous call. Omit to start over.
          name: cursor
          in: query
        - schema:
            type: string
            enum:
              - summary
              - full
            default: summary
            description: "summary: five fields per item. full: adds dates, amounts and the
              employee's note."
          required: false
          description: "summary: five fields per item. full: adds dates, amounts and the
            employee's note."
          name: view
          in: query
      responses:
        "200":
          description: One page of pending approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApprovalPage"
        "400":
          description: "Invalid query (invalid_query) or stale cursor (cursor_invalid:
            call again without cursor)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks: {}
